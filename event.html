    <style>
        /* Скелетоны и анимация */
        .skeleton {
            background: linear-gradient(90deg, #F3F5F8 25%, #E8EDF2 50%, #F3F5F8 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 10px;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .event-main-info {
            background: #FFFFFF;
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: var(--shadow-md);
        }
        
        .teams-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
        }

        .team-logo {
            width: 80px;
            height: 80px;
            background: var(--bg-light);
            border-radius: 50%;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.12);
            object-fit: contain;
            box-shadow: inset 0 0 20px rgba(56,189,248,0.12);
            backdrop-filter: blur(10px);
        }

        .vs-divider {
            font-size: 24px;
            font-weight: 900;
            opacity: 0.3;
            font-style: italic;
        }

        .event-teams-large {
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .market-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .market-tab {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            color: #c9d0d5;
            padding: 10px 16px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.18s ease;
            white-space: nowrap;
        }

        .market-tab:hover {
            background: rgba(56,189,248,0.12);
            color: var(--turquoise);
            border-color: rgba(56,189,248,0.3);
            transform: translateY(-1px);
        }

        .market-tab.active {
            background: var(--turquoise);
            color: #001314;
            border-color: var(--turquoise);
            box-shadow: 0 14px 35px rgba(56,189,248,0.16);
        }

        .market-section {
            margin-bottom: 25px;
            padding: 20px;
            border-radius: 20px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.04);
        }

        .market-name {
            display: block;
            font-size: 13px;
            font-weight: 800;
            color: var(--turquoise);
            text-transform: uppercase;
            margin-bottom: 12px;
            border-left: 3px solid var(--turquoise);
            padding-left: 10px;
        }

        .outcomes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .odd-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .odd-item:hover {
            background: rgba(56,189,248,0.12);
            border-color: var(--turquoise);
            transform: translateY(-2px);
        }

        .odd-item.selected {
            background: var(--turquoise);
            border-color: var(--turquoise);
            box-shadow: 0 0 16px rgba(56,189,248,0.35);
        }
        .odd-item.selected span {
            color: #000 !important;
            font-weight: 800;
        }
        .odd-item.selected:hover {
            background: rgba(45,212,191,0.9);
        }

        .conflict-msg { 
            color: var(--danger); font-size: 11px; text-align: center; 
            margin-bottom: 10px; font-weight: bold; display: none; 
            background: rgba(251, 113, 133, 0.12); padding: 8px; border-radius: 8px;
        }
        .odds-change {
            margin-top: 7px;
            padding: 6px 8px;
            border-radius: 8px;
            background: rgba(56,189,248,0.12);
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
        }

        .event-page-layout {
            display: grid !important;
            grid-template-columns: 220px minmax(0, 1fr) minmax(300px, 360px);
            gap: 24px;
            align-items: start;
            width: min(1440px, calc(100% - 32px));
        }

        .event-page-layout > * {
            min-width: 0;
        }

        #event-details-container,
        .market-section,
        .outcomes-grid,
        .odd-item {
            min-width: 0;
        }

        .odd-item {
            overflow-wrap: anywhere;
        }

        /* Mobile optimization for event page */
        @media (max-width: 1120px) {
            .event-page-layout {
                grid-template-columns: minmax(0, 1fr) minmax(300px, 340px);
            }

            .event-page-layout .sidebar {
                display: none;
            }
        }

        @media (max-width: 760px) {
            .event-page-layout {
                display: block !important;
                width: calc(100% - 20px);
                padding: 12px 0 96px !important;
            }

            .event-page-layout .content-area {
                width: 100%;
            }

            .event-main-info {
                padding: 24px 16px;
                margin-bottom: 20px;
                border-radius: 16px;
            }

            .teams-display {
                gap: 16px;
                margin: 16px 0;
            }

            .team-logo {
                width: 60px;
                height: 60px;
            }

            .event-teams-large {
                font-size: 22px;
                letter-spacing: -0.5px;
            }

            .outcomes-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px;
            }

            .odd-item {
                padding: 12px;
                border-radius: 10px;
                font-size: 13px;
            }

            .market-name {
                font-size: 12px;
                margin-bottom: 10px;
            }

            .market-tabs {
                gap: 8px;
                margin-bottom: 18px;
            }

            .market-tab {
                padding: 9px 14px;
                font-size: 12px;
            }

            .market-section {
                margin-bottom: 20px;
                padding: 16px;
            }
        }

        @media (max-width: 480px) {
            .event-main-info {
                padding: 18px 12px;
                margin-bottom: 16px;
                border-radius: 14px;
            }

            .teams-display {
                gap: 12px;
                margin: 14px 0;
            }

            .team-logo {
                width: 50px;
                height: 50px;
            }

            .vs-divider {
                font-size: 18px;
            }

            .event-teams-large {
                font-size: 18px;
            }

            .outcomes-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 8px;
            }

            .odd-item {
                padding: 10px 8px;
                border-radius: 10px;
                font-size: 12px;
                min-height: 48px;
                touch-action: manipulation;
            }

            .odds-change {
                margin-top: 5px;
                padding: 5px 6px;
                font-size: 10px;
            }
        }
    </style>
</head>

    <script>
        let currentEvent = null;
        let currentUser = null;
        let selectedMarketName = null;
        let isPlacingBet = false;

        const getSlip = () => JSON.parse(localStorage.getItem('visbet_slip') || '[]');
        const saveSlip = (data) => { 
            localStorage.setItem('visbet_slip', JSON.stringify(data)); 
            renderSlip();
            renderEventDetails(); // Перерисовываем, чтобы подсветить выбранные кнопки
        };

        function escapeJsArg(value) {
            return String(value || '')
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/\n/g, '')
                .replace(/\r/g, '');
        }

        function formatMoney(num) {
            return new Intl.NumberFormat('ru-RU').format(Math.round(num || 0)) + " ₽";
        }

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = value ?? '';
            return div.innerHTML;
        }

        function getSlipTotalOdd(slip = getSlip()) {
            return slip.reduce((prod, item) => prod * (Number(item.odd) || 1), 1);
        }

        function getSlipEventMeta(item) {
            const isCurrent = currentEvent && String(currentEvent.id) === String(item.id);
            const ev = isCurrent ? currentEvent : {};
            const teams = ev.teams ? `${ev.teams.home} — ${ev.teams.away}` : item.team;
            const dateTime = [ev.date || item.date, ev.time || item.time].filter(Boolean).join(' ');
            return {
                teams: teams || item.team || 'Событие',
                sport: ev.sport || item.sport || 'Sport',
                league: ev.league || item.league || 'Линия',
                dateTime: dateTime || 'Время уточняется',
                isLive: Boolean(ev.isLive || item.isLive),
                status: ev.isLive || item.isLive ? 'LIVE' : 'Pre-match'
            };
        }

        const API_FOOTBALL_LIVE_STATUSES = new Set(['1H', 'HT', '2H', 'ET', 'BT', 'P', 'SUSP', 'INT', 'LIVE']);
        const API_FOOTBALL_FINISHED_STATUSES = new Set(['FT', 'AET', 'PEN']);

        function getApiFootballState(ev = currentEvent || {}) {
            const statusShort = ev.apiFootballStatus?.short || ev.liveScore?.statusShort || '';
            const statusLong = ev.apiFootballStatus?.long || ev.liveScore?.statusLong || '';
            const elapsed = ev.apiFootballStatus?.elapsed ?? ev.liveScore?.elapsed ?? null;
            const isLive = API_FOOTBALL_LIVE_STATUSES.has(statusShort);
            const isFinished = API_FOOTBALL_FINISHED_STATUSES.has(statusShort);
            return {
                statusShort,
                statusLong,
                elapsed,
                hasScore: Boolean(ev.liveScore) || isLive || isFinished,
                isLive,
                isFinished
            };
        }

        function getLiveScoreText(ev = currentEvent || {}) {
            if (!ev.liveScore) return '';
            const home = Number.isFinite(Number(ev.liveScore.home)) ? Number(ev.liveScore.home) : 0;
            const away = Number.isFinite(Number(ev.liveScore.away)) ? Number(ev.liveScore.away) : 0;
            return `${home}:${away}`;
        }

        function renderEventLivePanel(ev = currentEvent || {}) {
            const state = getApiFootballState(ev);
            const score = getLiveScoreText(ev);
            if (!score && !state.isLive && !state.isFinished) return '';
            const minute = state.elapsed ? `${state.elapsed}'` : 'Время уточняется';
            const status = state.statusLong || state.statusShort || 'Live Score';
            return `
                <div class="event-live-panel">
                    <span class="live-score-chip ${state.isLive ? 'is-live' : ''}"><b>${state.isLive ? 'LIVE' : (state.isFinished ? 'FT' : 'SCORE')}</b>${score ? ` ${escapeHtml(score)}` : ''}</span>
                    <span>${escapeHtml(status)}</span>
                    <span>${escapeHtml(minute)}</span>
                </div>
            `;
        }

        function getRiskInfo(totalOdd, slipLength) {
            if (slipLength <= 1) return { level: 'Ординар', className: 'risk-low', percent: 18 };
            if (totalOdd >= 50) return { level: 'Высокий', className: 'risk-high', percent: 100 };
            if (totalOdd >= 8) return { level: 'Средний', className: 'risk-medium', percent: 62 };
            return { level: 'Низкий', className: 'risk-low', percent: 32 };
        }

        function updateCouponRisk(totalOdd, slipLength) {
            const risk = getRiskInfo(totalOdd, slipLength);
            const card = document.getElementById('coupon-risk-card');
            const level = document.getElementById('risk-level');
            const fill = document.getElementById('risk-meter-fill');
            if (card) card.className = `coupon-risk-card ${risk.className}`;
            if (level) level.innerText = risk.level;
            if (fill) fill.style.width = `${risk.percent}%`;
        }

        function hasSlipConflict(slip) {
            const seenMatches = {};
            return slip.some(item => {
                const key = `${item.id}::${item.market || 'market'}`;
                const duplicate = Boolean(seenMatches[key]);
                seenMatches[key] = true;
                return duplicate;
            });
        }

        function findFreshOddForSlipItem(item) {
            if (!currentEvent || String(item.id) !== String(currentEvent.id) || !Array.isArray(currentEvent.markets)) return null;
            const market = currentEvent.markets.find(m => m.name === item.market);
            if (!market || !Array.isArray(market.outcomes)) return null;
            const outcome = market.outcomes.find(out => (out.name || out.label) === item.pick);
            return outcome ? Number(outcome.odd) : null;
        }

        function syncSlipOddsForCurrentEvent() {
            let slip = getSlip();
            let changed = false;

            slip = slip.map(item => {
                const freshOdd = findFreshOddForSlipItem(item);
                if (freshOdd && freshOdd !== item.odd) {
                    item.previousOdd = item.odd;
                    item.odd = freshOdd;
                    item.oddChangedAt = Date.now();
                    changed = true;
                }
                return item;
            });

            if (changed) {
                localStorage.setItem('visbet_slip', JSON.stringify(slip));
                renderSlip();
            }
        }

        function getPendingBet(fingerprint) {
            const raw = localStorage.getItem('visbet_pending_bet');
            let pending = null;
            try { pending = raw ? JSON.parse(raw) : null; } catch (e) { pending = null; }
            if (!pending || pending.fingerprint !== fingerprint) {
                pending = {
                    fingerprint,
                    id: String(Date.now()) + String(Math.floor(Math.random() * 900000 + 100000))
                };
                localStorage.setItem('visbet_pending_bet', JSON.stringify(pending));
            }
            return pending;
        }

        function setPlaceOrderBusy(isBusy) {
            const btn = document.getElementById('btn-place-bet');
            if (!btn) return;
            btn.disabled = isBusy;
            btn.style.opacity = isBusy ? '0.45' : '1';
            btn.style.cursor = isBusy ? 'wait' : 'pointer';
            btn.innerHTML = `<span style="position: relative; z-index: 2;">${isBusy ? 'Отправляем...' : 'Заключить пари'}</span>`;
        }

        function refreshCouponButtonState() {
            const btn = document.getElementById('btn-place-bet');
            if (!btn) return;
            const disabled = isPlacingBet || hasSlipConflict(getSlip());
            btn.disabled = disabled;
            btn.classList.toggle('is-disabled', disabled);
            btn.style.opacity = disabled ? '0.62' : '1';
            btn.style.cursor = disabled ? 'not-allowed' : 'pointer';
            const openCouponButton = document.getElementById('openCouponButton');
            if (openCouponButton) {
                const count = getSlip().length;
                openCouponButton.textContent = count > 0 ? `Купон (${count})` : 'Купон';
            }
        }

        window.setStakePreset = (value) => {
            const input = document.getElementById('stakeAmount');
            if (!input) return;
            const balance = Math.round(Number(currentUser?.balance) || 0);
            const current = Math.round(parseFloat(input.value) || 0);
            if (value === 'all') input.value = balance || 100;
            else if (value === 'half') input.value = Math.max(10, Math.floor((balance || 0) / 2));
            else if (value === 'last') input.value = Number(localStorage.getItem('visbet_last_stake') || 0) || 100;
            else if (value === 'add100') input.value = current + 100;
            else if (value === 'add500') input.value = current + 500;
            else input.value = value;
            updateWin();
            if ('vibrate' in navigator) navigator.vibrate(25);
        };

        async function startPage() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (!id) return location.href = 'index.html';

            initUser();
            renderSlip();

            // Загрузка матча
            const docRef = window.fb.doc(window.db, "events", id);
            window.fb.onSnapshot(docRef, (snap) => {
                if (snap.exists()) {
                    currentEvent = { id: snap.id, ...snap.data() };
                    syncSlipOddsForCurrentEvent();
                    renderEventDetails();
                } else {
                    document.getElementById('event-details-container').innerHTML = "Событие не найдено.";
                }
            });
        }

        function initUser() {
            const uid = localStorage.getItem('visbet_user');
            const authZone = document.getElementById('auth-zone');
            const accountMenu = document.getElementById('accountMenu');
            const accountName = document.getElementById('accountMenuName');
            const accountBalance = document.getElementById('accountMenuBalance');
            const accountAdminBtn = document.getElementById('accountAdminButton');
            if(!uid) {
                location.href = 'register.html';
                return;
            }
            
            window.fb.onSnapshot(window.fb.doc(window.db, "users", uid.trim()), (doc) => {
                if(doc.exists()) {
                    currentUser = doc.data();
                    const displayName = currentUser.nickname || currentUser.displayName || currentUser.username;
                    const isAdmin = currentUser.role === 'admin' || currentUser.role === 'owner' || currentUser.username === 'Admin';
                    if (isAdmin) initEventAdminSupportNotice(currentUser);
                    if (accountMenu) accountMenu.style.display = 'block';
                    if (accountName) accountName.textContent = displayName;
                    if (accountBalance) accountBalance.textContent = `${Math.round(currentUser.balance).toLocaleString()} ₽`;
                    if (accountAdminBtn) accountAdminBtn.style.display = isAdmin ? 'flex' : 'none';
                    if (authZone) authZone.style.display = 'none';
                    document.getElementById('auth-zone').innerHTML = `
                        <div class="balance">${Math.round(currentUser.balance).toLocaleString()} ₽</div>
                        <div class="username" style="margin-left:10px; opacity:0.5;">${displayName}</div>
                    `;
                }
            });
        }

        let eventAdminSupportUnsubscribe = null;
        let eventAdminSupportReady = false;

        function initEventAdminSupportNotice(user) {
            const isAdmin = user?.role === 'admin' || user?.role === 'owner' || user?.username === 'Admin';
            if (!isAdmin || eventAdminSupportUnsubscribe || !window.fb?.onSnapshot || !window.fb?.collection) return;

            eventAdminSupportUnsubscribe = window.fb.onSnapshot(window.fb.collection(window.db, "support_messages"), (snapshot) => {
                const messages = snapshot.docs
                    .map(doc => ({ id: doc.id, ...doc.data() }))
                    .filter(msg => (msg.senderRole || 'user') !== 'admin' && msg.userId !== 'Admin')
                    .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                const latest = messages[0];

                if (!eventAdminSupportReady) {
                    eventAdminSupportReady = true;
                    return;
                }

                const seenAt = Number(localStorage.getItem('visbet_admin_support_seen_at') || 0);
                if (latest && (latest.timestamp || 0) > seenAt) {
                    showEventAdminSupportNotice(latest);
                }
            });
        }

        function showEventAdminSupportNotice(message) {
            let notice = document.getElementById('public-admin-support-notice');
            if (!notice) {
                notice = document.createElement('div');
                notice.id = 'public-admin-support-notice';
                notice.className = 'public-admin-support-notice';
                notice.innerHTML = `
                    <div>
                        <strong>Новое сообщение поддержки</strong>
                        <span id="public-admin-support-text"></span>
                    </div>
                    <button type="button" onclick="localStorage.setItem('visbet_admin_support_seen_at', String(Date.now())); location.href='admin.html?support=1'">Открыть</button>
                    <button class="public-admin-support-close" type="button" onclick="document.getElementById('public-admin-support-notice')?.classList.remove('show')">×</button>
                `;
                document.body.appendChild(notice);
            }
            const text = document.getElementById('public-admin-support-text');
            if (text) text.textContent = `${message.senderName || message.userId || 'Пользователь'}: ${message.message || ''}`;
            notice.classList.add('show');
        }

        window.logoutEventUser = () => {
            localStorage.removeItem('visbet_user');
            localStorage.removeItem('visbet_session');
            localStorage.removeItem('visbet_access_token');
            localStorage.removeItem('visbet_refresh_token');
            location.href = 'register.html';
        };

        function renderEventDetails() {
            if(!currentEvent) return;
            const slip = getSlip();
            const container = document.getElementById('event-details-container');
            const isClosed = currentEvent.status === 'Закрыт';
            const teams = currentEvent.teams || { home: 'Команда 1', away: 'Команда 2' };
            const markets = Array.isArray(currentEvent.markets) ? currentEvent.markets : [];
            const liveScore = getLiveScoreText(currentEvent);
            
            // Генерация ссылок на логотипы (используем инициалы команд)
            const getLogo = (name) => `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(name)}&backgroundColor=0b4d6b,0c7f95,05f3ff&fontSize=48`;

            container.innerHTML = `
                <div class="event-main-info">
                    <div style="opacity: 0.5; font-size: 12px; text-transform: uppercase; letter-spacing: 2px;">
                        ${currentEvent.sport} — ${currentEvent.league}
                    </div>
                    
                    <div class="teams-display">
                        <img src="${getLogo(teams.home)}" class="team-logo">
                        <div class="vs-divider">${liveScore || 'VS'}</div>
                        <img src="${getLogo(teams.away)}" class="team-logo">
                    </div>

                    <div class="event-teams-large">${teams.home} — ${teams.away}</div>
                    <div style="opacity: 0.6; margin-top: 10px;">${currentEvent.date} в ${currentEvent.time}</div>
                    ${renderEventLivePanel(currentEvent)}
                    ${isClosed ? '<div class="vb-badge danger" style="margin-top:14px;">Ставки закрыты</div>' : ''}
                </div>
                
                ${(() => {
                    const marketNames = markets.map(m => m.name);
                    const activeMarket = selectedMarketName || marketNames[0] || 'Все рынки';
                    const tabs = ['Все рынки', ...marketNames];
                    const selectedMarket = markets.find(m => m.name === activeMarket) || markets[0] || {name:'Основной рынок', outcomes:[]};
                    const marketsToRender = activeMarket === 'Все рынки' ? markets : [selectedMarket];
                    return `
                        <div class="market-tabs">
                            ${tabs.map(name => `
                                <button class="market-tab ${name === activeMarket ? 'active' : ''}" onclick="selectMarket('${escapeJsArg(name)}')">${name}</button>
                            `).join('')}
                        </div>
                        ${marketsToRender.map(market => `
                            <div class="market-section">
                                <span class="market-name">${market.name}</span>
                                <div class="outcomes-grid">
                                    ${market.outcomes.map(out => {
                                        const isSelected = slip.some(s => s.id === currentEvent.id && s.pick === out.name && s.market === market.name);
                                        return `
                                            <div class="odd-item ${isSelected ? 'selected' : ''}" 
                                                 ${isClosed ? 'style="opacity:0.35; pointer-events:none;"' : `onclick="addToSlip('${escapeJsArg(currentEvent.id)}', '${escapeJsArg(teams.home + ' — ' + teams.away)}', '${escapeJsArg(out.name)}', ${out.odd}, '${escapeJsArg(market.name)}')"`}>
                                                <span class="odd-label" style="font-weight: 600; font-size: 14px;">${out.name}</span>
                                                <span class="odd-val">${out.odd}</span>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        `).join('')}
                    `;
                })()}
            `;
        }

        window.selectMarket = (marketName) => {
            selectedMarketName = marketName;
            renderEventDetails();
        };

        window.addToSlip = (id, team, pick, odd, market) => {
            let slip = getSlip();
            const idx = slip.findIndex(i => i.id === id && i.pick === pick && i.market === market);
            const shouldOpenMobileCoupon = idx === -1 && window.matchMedia('(max-width: 760px)').matches;
            
            if(idx > -1) {
                slip.splice(idx, 1); // Если уже есть - убираем (toggle)
            } else {
                slip = slip.filter(i => !(i.id === id && i.market === market));
                slip.push({id, team, pick, odd, market, addedAt: Date.now()});
            }
            saveSlip(slip);
            if (shouldOpenMobileCoupon) {
                window.setTimeout(() => toggleCouponDrawer(true), 140);
            }
        };

        function renderSlip() {
            const slip = getSlip();
            const container = document.getElementById('slip-items');
            const footer = document.getElementById('slip-footer');
            const warn = document.getElementById('conflict-warning');

            if (slip.length === 0) {
                container.innerHTML = `
                    <div class="coupon-empty-state">
                        <div style="font-size: 24px; margin-bottom: 6px;">📋</div>
                        <p style="margin: 0; font-weight: 600; font-size: 12px;">Купон пуст</p>
                        <p style="margin: 4px 0 0; font-size: 11px; opacity: 0.6;">Выберите исходы на этой странице</p>
                    </div>`;
                footer.style.display = 'none';
                if (warn) warn.style.display = 'none';
                refreshCouponButtonState();
                return;
            }

            // Конфликт: нельзя брать несколько исходов одного рынка в экспресс
            const hasConflict = hasSlipConflict(slip);

            container.innerHTML = slip.map((item, idx) => {
                const meta = getSlipEventMeta(item);
                const changed = item.previousOdd && item.previousOdd !== item.odd;
                return `
                    <div class="coupon-item compact-coupon-item" data-idx="${idx}">
                        <div class="coupon-item-body">
                            <div class="coupon-item-meta">
                                <span class="coupon-status-pill ${meta.isLive ? 'is-live' : 'is-prematch'}">${meta.status}</span>
                                <span>${escapeHtml(meta.sport)}</span>
                                <span>${escapeHtml(meta.dateTime)}</span>
                            </div>
                            <div class="coupon-event-name">${escapeHtml(meta.teams)}</div>
                            <div class="coupon-league-line">${escapeHtml(meta.league)}</div>
                            <div class="coupon-pick-line">
                                <span>${escapeHtml(item.market || 'Market')}</span>
                                <strong>${escapeHtml(item.pick)}</strong>
                            </div>
                            ${changed ? `<div class="coupon-odd-change">Кэф: ${item.previousOdd} → ${item.odd}</div>` : ''}
                        </div>
                        <div class="coupon-odd-tile">
                            <span>КФ</span>
                            <strong>${Number(item.odd).toFixed(2)}</strong>
                            <button class="remove-btn" onclick="removeFromSlip(${idx})" title="Удалить из купона">×</button>
                        </div>
                    </div>
                `;
            }).join('');

            footer.style.display = 'grid';
            if (warn) warn.style.display = (slip.length > 1 && hasConflict) ? 'flex' : 'none';
            refreshCouponButtonState();

            const totalOdd = getSlipTotalOdd(slip).toFixed(2);
            document.getElementById('summary-odd').innerText = totalOdd;
            document.getElementById('bet-type').innerText = slip.length > 1 ? "ЭКСПРЕСС" : "ОРДИНАР";
            updateCouponRisk(Number(totalOdd), slip.length);
            updateWin();
        }

        window.removeFromSlip = (idx) => { let s = getSlip(); s.splice(idx, 1); saveSlip(s); };
        window.clearSlip = () => saveSlip([]);
        
        window.updateWin = () => {
            const amt = document.getElementById('stakeAmount').value || 0;
            const odd = parseFloat(document.getElementById('summary-odd').innerText);
            const totalWin = Math.floor(amt * odd);
            document.getElementById('winAmount').innerText = formatMoney(totalWin);
            const profitEl = document.getElementById('net-profit');
            if (profitEl) {
                profitEl.innerHTML = `<span class="profit-label">Чистая прибыль:</span><span class="profit-value">${formatMoney(totalWin - Number(amt || 0))}</span>`;
            }
        };

        window.placeOrder = async () => {
            if (isPlacingBet) return alert("Ставка уже отправляется");
            if(!currentUser) return alert("Пожалуйста, войдите в аккаунт");
            const slip = getSlip();
            const amount = Math.floor(document.getElementById('stakeAmount').value);
            
            if(!amount || amount < 10) return alert("Минимальная ставка 10 ₽");
            if(amount > currentUser.balance) return alert("Недостаточно средств");
            if(slip.length === 0) return alert("Купон пуст");
            if(hasSlipConflict(slip)) return alert("Нельзя выбрать несколько исходов одного рынка");

            const bet = {
                userId: currentUser.username,
                amount: amount,
                totalOdd: parseFloat(document.getElementById('summary-odd').innerText),
                items: slip,
                status: "В игре",
                date: new Date().toLocaleString(),
                timestamp: Date.now()
            };
            const fingerprint = JSON.stringify({
                userId: currentUser.username,
                amount,
                totalOdd: bet.totalOdd,
                items: slip.map(item => ({
                    id: item.id,
                    market: item.market,
                    pick: item.pick,
                    odd: item.odd
                }))
            });
            const pendingBet = getPendingBet(fingerprint);
            let createdNewBet = false;

            try {
                isPlacingBet = true;
                setPlaceOrderBusy(true);

                await window.fb.runTransaction(window.db, async (transaction) => {
                    const betRef = window.fb.doc(window.db, "bets", pendingBet.id);
                    const userRef = window.fb.doc(window.db, "users", currentUser.username);
                    const existingBet = await transaction.get(betRef);
                    if (existingBet.exists()) return;
                    createdNewBet = true;

                    const userSnap = await transaction.get(userRef);
                    if (!userSnap.exists()) throw new Error("Пользователь не найден");
                    const freshUser = userSnap.data();
                    if ((freshUser.balance || 0) < amount) throw new Error("Недостаточно средств");

                    transaction.set(betRef, {
                        ...bet,
                        requestKey: fingerprint,
                        idempotencyKey: pendingBet.id
                    });
                    transaction.update(userRef, {
                        balance: (freshUser.balance || 0) - amount
                    });
                });

                if (createdNewBet) {
                    await window.fb.setDoc(window.fb.doc(window.db, "balance_history", `bh_${pendingBet.id}`), {
                        userId: currentUser.username,
                        type: "Ставка",
                        label: `Списано за пари ${pendingBet.id.slice(-6)}`,
                        amount: -amount,
                        betId: pendingBet.id,
                        createdAt: new Date().toLocaleString(),
                        timestamp: Date.now()
                    });
                }

                saveSlip([]);
                localStorage.setItem('visbet_last_stake', String(amount));
                localStorage.removeItem('visbet_pending_bet');
                alert("Пари успешно принято!");
                location.href = 'index.html';
            } catch(e) {
                alert(e.message || "Ошибка соединения с сервером");
            } finally {
                isPlacingBet = false;
                setPlaceOrderBusy(false);
            }
        };

        window.toggleCouponDrawer = (show) => {
            const drawer = document.getElementById('rightCoupon');
            const backdrop = document.getElementById('couponDrawerBackdrop');
            if (!drawer || !backdrop) return;
            const isMobile = window.matchMedia('(max-width: 760px)').matches;
            if (show) {
                drawer.classList.add('drawer-open');
                backdrop.classList.add('visible');
                if (isMobile) {
                    document.documentElement.style.setProperty('--coupon-vh', `${window.innerHeight}px`);
                    document.body.classList.add('coupon-drawer-open');
                    document.body.style.overflow = 'hidden';
                }
                drawer.scrollIntoView({ behavior: 'smooth', block: 'end' });
            } else {
                drawer.classList.remove('drawer-open');
                backdrop.classList.remove('visible');
                document.body.classList.remove('coupon-drawer-open');
                document.body.style.overflow = '';
            }
        };

        window.addEventListener('storage', () => { renderSlip(); renderEventDetails(); });
        document.addEventListener('DOMContentLoaded', startPage);
    </script>
</body>
</html>
